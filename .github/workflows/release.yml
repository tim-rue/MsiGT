name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish -c Release -o publish -p:Version=$version
          Compress-Archive -Path "publish\MSI GPU Tools.exe", README.md, LICENSE -DestinationPath "MSI-GPU-Tools-$version-win-x64.zip"
          dotnet publish -c Release -o publish-standalone -p:Version=$version --self-contained -p:EnableCompressionInSingleFile=true
          Compress-Archive -Path "publish-standalone\MSI GPU Tools.exe", README.md, LICENSE -DestinationPath "MSI-GPU-Tools-$version-win-x64-standalone.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $prerelease = if ($version -match '-') { '--prerelease' } else { $null }
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete '${{ github.ref_name }}' --yes }
          gh release create '${{ github.ref_name }}' "MSI-GPU-Tools-$version-win-x64.zip" "MSI-GPU-Tools-$version-win-x64-standalone.zip" "publish\MSI GPU Tools.exe" `
            --title "MSI GPU Tools $version" --generate-notes $prerelease
