name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish -c Release -o publish -p:Version=$version
          Compress-Archive -Path "publish\MSI GPU Tools.exe", README.md, LICENSE -DestinationPath "MsiGT-$version-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $prerelease = if ($version -match '-') { '--prerelease' } else { $null }
          gh release create '${{ github.ref_name }}' "MsiGT-$version-win-x64.zip" "publish\MSI GPU Tools.exe" `
            --title "MsiGT $version" --generate-notes $prerelease
