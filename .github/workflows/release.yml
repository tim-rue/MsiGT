name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          dotnet publish -c Release -o publish -p:Version=$version
          dotnet publish -c Release -o publish-standalone -p:Version=$version --self-contained -p:EnableCompressionInSingleFile=true
          foreach ($build in @(@{ Dir = 'publish'; Name = "MSI_GPU_Tools-$version-win-x64" },
                               @{ Dir = 'publish-standalone'; Name = "MSI_GPU_Tools-$version-win-x64-standalone" })) {
            Compress-Archive -Path "$($build.Dir)\MSI GPU Tools.exe", README.md, LICENSE -DestinationPath "dist\$($build.Name).zip"
            Copy-Item "$($build.Dir)\MSI GPU Tools.exe" "dist\$($build.Name).exe"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $prerelease = if ($version -match '-') { '--prerelease' } else { $null }
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete '${{ github.ref_name }}' --yes }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName `
            --title "MSI GPU Tools $version" --generate-notes $prerelease
